name: Little Lifeline App Store What's New

on:
  workflow_dispatch:
    inputs:
      version:
        description: App Store versionString to update; must equal docs/appstore/listing.json version
        required: true
        default: "3.3"
        type: string
      locale:
        description: App Store version localization whose What's New is replaced
        required: true
        default: en-US
        type: string

permissions:
  contents: read

concurrency:
  group: asc-whatsnew-${{ github.repository }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  WHATS_NEW_VERSION: ${{ inputs.version }}
  WHATS_NEW_LOCALE: ${{ inputs.locale }}

jobs:
  patch-whatsnew:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate inputs against the committed listing
        run: |
          [[ "$WHATS_NEW_VERSION" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]]
          [[ "$WHATS_NEW_LOCALE" =~ ^[a-z]{2,3}(-[A-Za-z0-9]{2,8})*$ ]]
          python3 - <<'PY'
          import json, os
          listing = json.load(open('docs/appstore/listing.json', encoding='utf-8'))
          assert listing['version'] == os.environ['WHATS_NEW_VERSION'], 'listing.json version differs from the requested version.'
          assert listing.get('whatsNew', '').strip(), 'listing.json has no whatsNew text.'
          print('listing.json version', listing['version'], 'whatsNew length', len(listing['whatsNew']))
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the App Store Connect client dependency
        run: python3 -m pip install --disable-pip-version-check cryptography

      - name: Test the patcher offline
        run: python3 -m unittest discover -s Tools/tests -p test_patch_whatsnew.py

      - name: Install App Store Connect credential
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          test -n "$ASC_KEY_ID"
          test -n "$ASC_KEY_P8"
          umask 077
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"

      - name: Replace What's New only (no review submission, no TestFlight upload)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          test -n "$ASC_ISSUER_ID"
          export ASC_KEY_PATH="$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"
          python3 Tools/patch_whatsnew.py \
            --version "$WHATS_NEW_VERSION" --locale "$WHATS_NEW_LOCALE" | tee whatsnew.log
          {
            echo "What's New for $WHATS_NEW_VERSION ($WHATS_NEW_LOCALE) was patched from docs/appstore/listing.json."
            echo 'No review submission was created and no build was uploaded.'
            echo
            echo '```'
            cat whatsnew.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove App Store Connect credential
        if: always()
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          if [[ -n "$ASC_KEY_ID" ]]; then
            rm -f "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"
          fi
          rm -rf "$RUNNER_TEMP/asc"
